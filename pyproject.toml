[project]
name = "jpeg-crop-rotate"
version = "0.2.1"
requires-python = ">=3.10"
dependencies = []

# app.py is a standalone script (PEP 723 inline metadata) meant to be run
# directly via `uv run app.py` — this file exists only so the test suite's
# own dependencies (pytest, Pillow, etc.) can be installed with `uv run
# pytest`. It is not an installable package.
[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pillow>=10.0",
    "PyQt6>=6.6",
    "piexif>=1.1.3",
]
